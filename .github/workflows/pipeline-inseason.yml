name: Pipeline - inseason daily

# Story 2.6 (FR-21, SM-4). Active Series stop being this workflow's output only
# when the owner remembers to type a command: the Apr-Jun 2027 window is where
# the product's traffic is measured, and data that went stale in May
# invalidates the measurement itself.
#
# Three cron lines are ONE bracket written three ways — a cron day-of-month
# range cannot express "mid-April through June" in a single line (owner decision
# D-5, which chose the generous bracket over a date the owner re-declares every
# spring). 07:30 UTC deliberately follows the 07:00 keepalive instead of sharing
# its minute, so warming a sleeping Supabase instance is not made this
# cadence's failure mode. Both minutes moved from 09:00/09:30 by the owner's
# 2026-10-04 call: the ESPN scoreboard filters by US local date, so the run
# reads yesterday in America/New_York, and 07:30 UTC is 02:30-03:30 there —
# after the last ordinary tip-off but NOT safely after every game. A 10 pm ET
# game that reaches extra overtime can still be non-Final when the run asks;
# `espn` excludes it and names the exclusion, the next morning asks a LATER
# date, and the residue is a missing row rather than a red run — detected by
# Story 2.7's row-count-vs-bracket read, not by this cadence (the traded margin:
# spec-2-13 schedule-amendment.md). The pair moves together because the
# keepalive pings the same PostgREST endpoint this cadence reads and writes —
# pipeline alone would wake up cold.
#
# These three lines are the only date expression in the design. `--require-feed`
# is declared here rather than defaulted in the runner, because the runner stays
# date-blind (AD-4, Story 2.4 Decision 2 — the reason `deriveSeason` was a
# fetch-scope rule and never a state rule; [2026-10-06, Story 2.16: `deriveSeason`
# was deleted with nbaCom.ts, and the live fetch-scope rule is `deriveRequestDate`
# in adapters/espn.ts, under the same constraint]). The alternative was a second Apr-Jun
# rule in code that could disagree with the cron it is meant to match. When the
# bracket moves — a lockout, a shifted Play-In, a Finals running past June 23 —
# the edit happens in this file and nowhere else.
#
# The known cost of the generous bracket: a false alarm on the leading edge in a
# year the postseason feed is still empty on April 16. That is one human read,
# then the line above moves; Story 2.7's drill measures the real first-non-empty
# date so it stops being assumed.
#
# The trailing edge is June 24, not June 30 (owner call 2026-10-05, Story 2.6
# review #39). `espn` reads ONE previous-ET date per run, so every day after the
# Finals end returns an empty feed. With a June 30 end that was 10-15 straight
# reds, all landing in the one deduped issue, where a real failure would read as
# just another "Still red". The June 24 run reads June 23, which still covers a
# Finals Game 7 as late as the modern format has played one (June 22, 2025 — from
# the schedule, not measured here). `pipeline-offseason.yml`'s June 25 run then
# reads June 24 with no alarm. A shorter Finals still leaves a short tail of
# reds; that residue is accepted.
#
# The same one-date read means a red or cancelled run does not catch up later:
# the next morning asks a LATER date, so a Game 7 played the day before a failed
# run never reaches the table on its own. The issue body below names the
# manual_csv recovery for exactly that case. [2026-10-06, Story 2.18: each run
# also re-reads the PREVIOUS date, but for births only (Game 6s at 3-3). Its
# Game 7s are ignored (owner decision, Story 2.18 review), so this paragraph
# still holds for completions. The re-read never counts toward
# `--require-feed`.]
#
# Story 2.18 — births. A Final Game 6 at 3-3 whose pair is not stored is
# backfilled (games 1-5 by single dates, <=21 back, <=25 extra requests and ~3
# minutes per run) and born by the run itself. When a backfill cannot certify the
# 3-3, the runner prints a `BIRTH NEEDED:` line and still exits on the merits of
# the rest of the run. The two steps after the failure step grep the run's log
# for that prefix and file a SEPARATE issue, "Pipeline birth needed <date>", so a
# needed birth never reads as a failed run and a failed run never hides a needed
# birth. Mechanism choice: a log grep over `tee`, rather than a non-zero exit code
# or a second workflow, because the alert must not change the exit code
# (completions and the insights refresh are not blocked by it) and must land
# within the same cron cycle; the `notify-failure` action is reused as is. The
# title carries the run's UTC date (Story 2.18 review, owner decision 2026-10-06):
# on an open issue `notify-failure` comments only a run link, so a stable title
# would bury a later day's series behind "Still red". One issue per day keeps
# every alert line in an issue body; a same-day re-run comments on that day's.

on:
  schedule:
    - cron: '30 7 16-30 4 *'
    - cron: '30 7 * 5 *'
    - cron: '30 7 1-24 6 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print the plan, write nothing'
        type: boolean
        default: false
      require_feed:
        description: 'Fail if the feed carried no series (what the schedule does)'
        type: boolean
        default: false
      source:
        description: 'Adapter: espn is the feed, manual_csv the floor, fantrax the refusal'
        type: choice
        options:
          - espn
          - manual_csv
          - fantrax
        default: espn

# One group shared with pipeline-offseason.yml. A hand dispatch queues behind a
# scheduled run instead of interleaving a completion write with it, and
# cancel-in-progress is off because killing a run halfway through its write
# phase is the one outcome worse than waiting. The queue is ONE slot deep:
# GitHub keeps a single pending run per group, so a third arrival cancels the
# pending one, and a cancelled run files no issue. Do not dispatch while a run
# is both running and pending.
concurrency:
  group: pipeline-writes
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # A hung run is the one failure this design cannot otherwise hear, and the
    # shared `pipeline-writes` group with `cancel-in-progress: false` makes the
    # hang block every later cron. The ceilings are generous (the runner's own
    # fetch loop self-limits to 25 s x 3 attempts per leg) so they only ever cut
    # off a stall. The STEP ceilings are what make a stall loud: a step that
    # times out FAILS, so `if: failure()` fires. A job that hits its own
    # `timeout-minutes` is CANCELLED instead, and `failure()` is false, so the
    # job ceiling below is only the backstop for checkout/setup-node and sits
    # above the sum of the step ceilings.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # Native type stripping (Node >= 22.18) is what lets `node run.ts`
          # execute at all. ci.yml's floating 22.x is not evidence: that job
          # never runs this entry point.
          node-version: '24.x'
          cache: npm

      # The absence of a secret must arrive as the NAME of a variable, never as
      # a fetch error several legs into the run (CAP-4). Only names are echoed.
      - name: Refuse on a missing secret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$SUPABASE_URL" ]; then missing+=(SUPABASE_URL); fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing+=(SUPABASE_SERVICE_ROLE_KEY); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing repository secrets: ${missing[*]}"
            echo "Add them in Settings -> Secrets and variables -> Actions. A rotation has to land in both stores - this one and the local .env."
            exit 1
          fi

      # `@supabase/supabase-js` is a runtime dependency, so the production
      # install is enough to run the pipeline.
      - run: npm ci --omit=dev
        timeout-minutes: 5

      - name: Run the pipeline
        timeout-minutes: 10
        # Note what is NOT here: `--env-file=.env`, which is how the operator
        # command is written in the docs. A runner has no .env, and Node treats
        # a missing env-file as fatal — so the credentials arrive through the
        # env: block instead and the command line stays free of them.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PIPELINE_SOURCE: ${{ inputs.source || 'espn' }}
          WANT_REQUIRE_FEED: ${{ github.event_name == 'schedule' || inputs.require_feed }}
          WANT_DRY_RUN: ${{ inputs.dry_run }}
        # `pipefail` keeps the runner's exit code the step's exit code through
        # the `tee` that keeps a copy of the log for the birth-needed grep.
        run: |
          set -o pipefail
          flags=()
          if [ "$WANT_REQUIRE_FEED" = "true" ]; then flags+=(--require-feed); fi
          if [ "$WANT_DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          echo "adapter=$PIPELINE_SOURCE flags=${flags[*]}"
          node supabase/scripts/pipeline/run.ts "--source=$PIPELINE_SOURCE" "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/pipeline.log"

      - name: File a loud failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: Pipeline inseason run failed
          body: >-
            The daily inseason pipeline run went non-zero. The log above carries
            the adapter's run report (series counted, depth histogram, named
            exclusions) and the runner's refusal message, so the diagnosis needs
            no local reproduction. If the message names a missing environment
            variable, the repository secret is absent or rotated. If it reads
            `--require-feed: espn returned 0 series`, the endpoint answered and
            carried no game at all on the date it derived: that is the alarm
            working inside the declared window, and the question is whether the
            postseason really is on a rest day. A day with games but no Game 7
            and no Game 6 at 3-3 goes GREEN with an empty plan. A needed birth
            the run could not certify is NOT this issue: it files "Pipeline
            birth needed" and leaves the exit code alone.


            MISSED GAME 7 RECOVERY. The scheduled source completes a series
            only from the previous US Eastern date and never re-asks a date it
            missed for a Game 7 (its re-read of the date before looks for Game
            6 births only), so if a Game 7 was played on the date this run was
            reading, the next scheduled run will NOT pick it up. Recover by
            hand: append that Game 7 row to
            supabase/scripts/pipeline/data/series_manual.csv (the series' games
            1-6 are already there from the curated birth), then run
            `node --env-file=.env supabase/scripts/pipeline/run.ts
            --source=manual_csv --dry-run` and read the plan; if it shows the
            one completion, run it again without --dry-run. Equivalently, push
            the CSV edit and dispatch this workflow with source=manual_csv,
            dry_run first. The completion is idempotent and refreshes the
            insights cache.

      # Story 2.18: after the failure step on purpose (so it stays the first
      # `notify-failure` step), and on `always()` so a red run that also printed
      # an alert files both issues. The log only exists if the run step started.
      - name: Collect birth-needed alerts
        id: alerts
        if: always()
        run: |
          log="$RUNNER_TEMP/pipeline.log"
          if [ -f "$log" ] && grep -q '^BIRTH NEEDED:' "$log"; then
            {
              echo 'found=true'
              echo "date=$(date -u +%F)"
              echo 'lines<<BIRTH_NEEDED_EOF'
              grep '^BIRTH NEEDED:' "$log"
              echo 'BIRTH_NEEDED_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: File a birth-needed alert
        if: always() && steps.alerts.outputs.found == 'true'
        uses: ./.github/actions/notify-failure
        with:
          title: Pipeline birth needed ${{ steps.alerts.outputs.date }}
          body: >-
            The scheduled run saw a playoff series that should now be in Active
            Series (a Game 6 at 3-3, or a Game 7 for a series never born) and
            could NOT birth it from the feed, or could not read a date it needed.
            This is not a failed run: completions and the insights refresh went
            ahead, and the run's exit code is unchanged. Follow
            docs/PLAYOFF_RUNBOOK.md (the fallback procedure) for each line
            below, before that series' Game 7 tips off. Each day's alerts open
            their own issue, dated in the title; a re-run on the same day
            comments here with a run link only, so read that run's log for its
            lines.


            ${{ steps.alerts.outputs.lines }}
