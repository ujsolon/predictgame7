name: Keep Supabase awake

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query one row via PostgREST
        run: |
          set -a
          source .env
          set +a
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/teams?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            exit 1
          fi
