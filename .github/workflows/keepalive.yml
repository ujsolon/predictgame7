name: Keep Supabase awake

on:
  schedule:
    - cron: '35 16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Query one row via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing secrets: add SUPABASE_URL and SUPABASE_ANON_KEY in repo Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -s -o "$body" -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/teams?select=id&limit=1") || code="curl-failed"
          echo "HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "Response body:"
            head -c 500 "$body"
            exit 1
          fi
