name: Keep Supabase awake

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Query one row via PostgREST
        run: |
          set -a
          source <(sed 's/\r$//' .env)
          set +a
          body=$(mktemp)
          code=$(curl -s -o "$body" -w "%{http_code}" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/teams?select=id&limit=1") || code="curl-failed"
          echo "HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "Response body:"
            head -c 500 "$body"
            exit 1
          fi
