name: Nightly gate

# Epic 1 retro item 7. `ci.yml` reports on every push and `.githooks/pre-push`
# blocks a red push, but neither of them fires when nothing is pushed: a
# dependency drifting underneath a green tree, an expired secret, or a commit
# that reached `master` through a path that skipped the hook. This runs the same
# four steps nightly so a red gate is discovered rather than rediscovered by the
# next person to push.
#
# Added alongside the existing workflows rather than folded into them, matching
# the convention Story 2.6 states for new scheduled work. The failure step
# opens an issue because GitHub routes scheduled-workflow notifications to
# whoever created the file and only when that person's own Actions
# notifications are switched on — an issue is loud without depending on
# anyone's settings.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # Vite 8 engines: ^20.19.0 || >=22.12.0
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Verification gate (lint, typecheck, test, build)
        run: npm run gate

      - name: File a loud failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Nightly gate is red"
          BODY="The verification gate failed on a scheduled run of \`$GITHUB_REF_NAME\` at \`${GITHUB_SHA:0:7}\`.\n\nRun: $RUN_URL\n\nSteps: \`npm run lint\`, \`npm run typecheck\`, \`npm run test\`, \`npm run build\` — the first red one is in the log above."
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq 'map(.number) | .[0] // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still red: $RUN_URL (\`${GITHUB_SHA:0:7}\`)"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(echo -e "$BODY")"
          fi
