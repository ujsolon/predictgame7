name: Pipeline - offseason bracket edges

# Story 2.6 (FR-20, SM-4). The AC's "initialize at playoff start, finalize at
# playoff end, idempotently" is not a separate mechanism: one runner invocation
# over the postseason feed does both, because the write is a certified 3-3 birth
# or a game-7 completion and never anything else. So this file schedules the same
# command at the two edges of the bracket rather than adding a code path —
# there is nothing here to get out of sync with the daily run.
#
# Story 2.13 narrows what the SCHEDULED source can contribute here. `espn` is
# date-granular — one day per run, no lookback — so it carries a Game 7 and
# never a series' first six games: this cadence finalizes. The initialize half
# of the AC is served by `--source=manual_csv` run by hand (this file offers no
# `source` dispatch input, and `pipeline-inseason.yml` does), and Story 2.7's
# drill owns it; a birth from a one-game source is refused by the runner rather
# than guessed. [2026-10-06, Story 2.18: `espn` now also births a series at a
# feed-observed 3-3 (a bounded single-date backfill plus a re-read of the
# previous date), so either edge can initialize as well as finalize from the
# feed. A birth the run cannot certify prints `BIRTH NEEDED:` and files the
# separate, dated "Pipeline birth needed <date>" issue through the last two
# steps, exactly as the inseason file does; the exit code is unchanged by it.]
#
# What this file deliberately lacks is `--require-feed`: an empty feed on April
# 12, before the postseason really starts, is legitimate, and making it red
# would train the owner to ignore the one alarm that matters (failure mode 1).
# Both edges sit outside the alarm window. `pipeline-inseason.yml`'s June line
# ends on the 24th (owner call 2026-10-05, Story 2.6 review #39), so the June 25
# run here reads June 24 with no alarm: it finalizes a Game 7 played that late,
# and stays green on the empty post-Finals feed that would otherwise be red.
# The absence is the design decision, which is why it is visible in a workflow
# file and not derived from a date in code.

on:
  schedule:
    - cron: '30 7 12 4 *'
    - cron: '30 7 25 6 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print the plan, write nothing'
        type: boolean
        default: false

# Shared with pipeline-inseason.yml for the same reason: one run at a time
# against the write RPCs, and never a cancelled half-written series.
concurrency:
  group: pipeline-writes
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Same ceilings as the inseason file, for the same reason: the step ceilings
    # make a stall FAIL (so `if: failure()` fires), while a job that hits its
    # own ceiling is cancelled and files nothing, so the job ceiling is only the
    # backstop and sits above the sum of the step ones.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Refuse on a missing secret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$SUPABASE_URL" ]; then missing+=(SUPABASE_URL); fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing+=(SUPABASE_SERVICE_ROLE_KEY); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing repository secrets: ${missing[*]}"
            echo "Add them in Settings -> Secrets and variables -> Actions. A rotation has to land in both stores - this one and the local .env."
            exit 1
          fi

      - run: npm ci --omit=dev
        timeout-minutes: 5

      - name: Run the pipeline
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WANT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          flags=()
          if [ "$WANT_DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          echo "adapter=espn flags=${flags[*]} (no empty-feed alarm on this schedule, by design)"
          node supabase/scripts/pipeline/run.ts --source=espn "${flags[@]}" 2>&1 | tee "$RUNNER_TEMP/pipeline.log"

      - name: File a loud failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: Pipeline offseason run failed
          body: >-
            The postseason bracket edge run went non-zero. This schedule carries
            no empty-feed alarm, so a red here is something that should not have
            happened at all: a failed fetch, a feed shape the parser refused, a
            series the archive guard rejected, or a missing repository secret.
            The log above names which, and it carried no credential value into
            the command line to do it.

      # Story 2.18: the same two steps as pipeline-inseason.yml, same dated
      # title ("Pipeline birth needed <UTC date>"), so a day's alerts land in one
      # issue whichever cadence ran (the two schedules never share a date).
      - name: Collect birth-needed alerts
        id: alerts
        if: always()
        run: |
          log="$RUNNER_TEMP/pipeline.log"
          if [ -f "$log" ] && grep -q '^BIRTH NEEDED:' "$log"; then
            {
              echo 'found=true'
              echo "date=$(date -u +%F)"
              echo 'lines<<BIRTH_NEEDED_EOF'
              grep '^BIRTH NEEDED:' "$log"
              echo 'BIRTH_NEEDED_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: File a birth-needed alert
        if: always() && steps.alerts.outputs.found == 'true'
        uses: ./.github/actions/notify-failure
        with:
          title: Pipeline birth needed ${{ steps.alerts.outputs.date }}
          body: >-
            The bracket-edge run saw a playoff series that should now be in
            Active Series (a Game 6 at 3-3, or a Game 7 for a series never born)
            and could NOT birth it from the feed, or could not read a date it
            needed. This is not a failed run; its exit code is unchanged. Follow
            docs/PLAYOFF_RUNBOOK.md (the fallback procedure) for each line
            below, before that series' Game 7 tips off. Each day's alerts open
            their own issue, dated in the title; a re-run on the same day
            comments here with a run link only, so read that run's log for its
            lines.


            ${{ steps.alerts.outputs.lines }}
