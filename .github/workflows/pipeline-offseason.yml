name: Pipeline - offseason bracket edges

# Story 2.6 (FR-20, SM-4). The AC's "initialize at playoff start, finalize at
# playoff end, idempotently" is not a separate mechanism: one runner invocation
# over the postseason feed does both, because the write is a certified 3-3 birth
# or a game-7 completion and never anything else. So this file schedules the same
# command at the two edges of the bracket rather than adding a code path —
# there is nothing here to get out of sync with the daily run.
#
# Story 2.13 narrows what the SCHEDULED source can contribute here. `espn` is
# date-granular — one day per run, no lookback — so it carries a Game 7 and
# never a series' first six games: this cadence finalizes. The initialize half
# of the AC is served by `--source=manual_csv` run by hand (this file offers no
# `source` dispatch input, and `pipeline-inseason.yml` does), and Story 2.7's
# drill owns it; a birth from a one-game source is refused by the runner rather
# than guessed.
#
# What this file deliberately lacks is `--require-feed`: an empty feed on April
# 12, before the postseason really starts, is legitimate, and making it red
# would train the owner to ignore the one alarm that matters (failure mode 1).
# Only April 12 sits outside the alarm window. June 25 is INSIDE it —
# `pipeline-inseason.yml`'s `1-30 6` line fires the same morning with the flag
# on, and the two queue in `pipeline-writes` — so this file's June run is the
# finalize pass re-run, not a quiet edge. The absence is the design decision,
# which is why it is visible in a workflow file and not derived from a date in
# code.

on:
  schedule:
    - cron: '30 7 12 4 *'
    - cron: '30 7 25 6 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print the plan, write nothing'
        type: boolean
        default: false

# Shared with pipeline-inseason.yml for the same reason: one run at a time
# against the write RPCs, and never a cancelled half-written series.
concurrency:
  group: pipeline-writes
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Same ceilings as the inseason file, for the same reason: the step ceilings
    # make a stall FAIL (so `if: failure()` fires), while a job that hits its
    # own ceiling is cancelled and files nothing, so the job ceiling is only the
    # backstop and sits above the sum of the step ones.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Refuse on a missing secret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$SUPABASE_URL" ]; then missing+=(SUPABASE_URL); fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then missing+=(SUPABASE_SERVICE_ROLE_KEY); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing repository secrets: ${missing[*]}"
            echo "Add them in Settings -> Secrets and variables -> Actions. A rotation has to land in both stores - this one and the local .env."
            exit 1
          fi

      - run: npm ci --omit=dev
        timeout-minutes: 5

      - name: Run the pipeline
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WANT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          if [ "$WANT_DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          echo "adapter=espn flags=${flags[*]} (no empty-feed alarm on this schedule, by design)"
          node supabase/scripts/pipeline/run.ts --source=espn "${flags[@]}"

      - name: File a loud failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: Pipeline offseason run failed
          body: >-
            The postseason bracket edge run went non-zero. This schedule carries
            no empty-feed alarm, so a red here is something that should not have
            happened at all: a failed fetch, a feed shape the parser refused, a
            series the archive guard rejected, or a missing repository secret.
            The log above names which, and it carried no credential value into
            the command line to do it.
