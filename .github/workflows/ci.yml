name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # Vite 8 engines: ^20.19.0 || >=22.12.0
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Blocking typecheck of the app graph (`src` + `vite.config.ts`), which
      # Story 1.2 made green — so this step can fail. It does not cover
      # `supabase/functions/**`; that graph is checked by the `deno check` step
      # at the end of this job, not here.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Story 2.0: the producer side of the AD-2 contract. `npm run typecheck`
      # above covers `src` + `vite.config.ts` only, so without this step nothing
      # type-checks the Edge Functions or the `../_shared/` hop they import.
      # CI-only by owner decision: Deno is not installed on the dev box, so a run
      # here is the first evidence this step can produce — `npm run gate` does not
      # cover it and is not claimed to.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Not hermetic, by nature rather than by oversight: `deno check` needs network
      # egress and resolves every remote specifier (jsr.io / esm.sh / deno.land) plus the
      # npm packages in the runner's node_modules. Registry availability and upstream type
      # releases are therefore gate dependencies — a red here can mean "upstream changed",
      # not "this push broke something", and it must be read that way before blaming the
      # commit. Measured on this step's first run (2026-09-30): the floating
      # `jsr:@supabase/supabase-js@2` resolved to 2.117.2, whose JSR source imports
      # `npm:@supabase/realtime-js@2.117.2` — absent from node_modules, which holds the
      # client's pinned 2.103.1. Both functions now import that client from esm.sh, whose
      # graph resolves entirely over HTTPS and never consults node_modules.
      - name: Edge Function type-check (deno check)
        run: |
          # globstar, so a file added a directory deeper cannot slip past the
          # pattern unchecked; the resolved list is printed so a short run is
          # visible in the log rather than silently green.
          shopt -s globstar
          files=(supabase/functions/**/*.ts)
          printf 'Checking %s files:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          deno check "${files[@]}"
