name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          # Vite 8 engines: ^20.19.0 || >=22.12.0
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Blocking typecheck of the app graph (`src` + `vite.config.ts`), which
      # Story 1.2 made green — so this step can fail. It does not cover
      # `supabase/functions/**`: no gate here type-checks the Edge Functions.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build
